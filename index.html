<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <title>Title</title>
    <link href="style.css" rel="stylesheet" type="text/css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>

        function updateDatabase(userName, updateData) {
            $.ajax({
                url: 'https://9enfj7en82.execute-api.eu-central-1.amazonaws.com/dinomix/update', // Replace with your API Gateway endpoint
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    user_id: userName,
                    prop: updateData
                }),
                success: function(response) {
                    console.log('Lambda response:', response);
                },
                error: function(xhr, status, error) {
                    console.error('Lambda call failed:', error);
                }
            });
        }

        $(function () {

            const BIOMES = [
                {
                    id: 'plain',
                    name: 'Forest',
                    subtitle: 'A wild adventure awaits!',
                    background: './background.jpg',
                    maxMeteorSpeed: 30,
                    eggsToUnlock: 10,
                    meteoriteImage: './meteor-green.png',
                    bannerColor: '#eaffd7',
                    bannerShadow: '0 0 20px #62c82e, 0 0 40px #1d6b24'
                },
                {
                    id: 'tundra',
                    name: 'Frosty Tundra',
                    subtitle: 'More eggs incoming!',
                    background: './background-tundra.png',
                    maxMeteorSpeed: 45,
                    eggsToUnlock: 15,
                    meteoriteImage: './meteor-blue.png',
                    iceEffects: true,
                    snow: true,
                    bannerColor: '#F0F8FF',
                    bannerShadow: '0 0 20px #00aaff, 0 0 40px #0055ff'
                },
                {
                    id: 'volcano',
                    name: 'Volcano',
                    subtitle: 'Hot and fiery!',
                    background: './background-volcano.png',
                    maxMeteorSpeed: 60,
                    eggsToUnlock: 20,
                    meteoriteImage: './meteor-red.png',
                    burningDust: true,
                    bannerColor: '#961A2F',
                    bannerShadow: '0 0 20px #FF6347, 0 0 40px #FF0000'
                }
            ];
            const DEFAULT_METEORITE_FALL_STEP = 5;
            const GAME_WIDTH = 1152;
            const GAME_HEIGHT = 648;
            const STATUS_HEIGHT = 72;
            const DINO_WIDTH = 200;
            const EGG_WIDTH = 74;
            const METEOR_WIDTH = 70;
            const SAFE_FALL_DISTANCE = DINO_WIDTH + Math.max(EGG_WIDTH, METEOR_WIDTH) + 10;
            const FALLING_OBJECT_MARGIN = 20;

            let speedEgg = 50;
            let speedMeteorite = 20;
            let meteoriteFallStep = DEFAULT_METEORITE_FALL_STEP;
            let counterMeteorites = 0;
            let counterEggs = 0;
            let counterSavedEggs = 0;
            let totalSavedEggs = 0;
            let counterGoldenEggs = 0;
            let maxMeteorites = 100;
            let currentBiomeIndex = 0;
            let maxEggs = BIOMES[0].eggsToUnlock;
            let eggProcess = null;
            let eggSpawnTimer = null;
            let delayBetweenMeteorites = 500;
            let delayBetweenEggs = 2000;
            let meteoritePositionX = 0;
            let meteoriteActive = false;
            let eggPositionX = null;
            let maxMeteorSpeed = BIOMES[0].maxMeteorSpeed;
            let gameRunning = true;
            let gamePaused = false;
            let gameTimers = new Set();
            let eggInFlight = false;
            let eggSpawnScheduled = false;
            const DINO_FACE_LEFT = 'scaleX(1)';
            const DINO_FACE_RIGHT = 'scaleX(-1)';

            let timeScale = 1; // 1 = normal speed; higher values slow the game (e.g., 50)
            let slowActive = false;

            function sleep(ms) {
                return new Promise(resolve => {
                    let timer = setTimeout(function () {
                        gameTimers.delete(timer);
                        resolve();
                    }, ms);
                    gameTimers.add(timer);
                });
            }

            function gameInterval(callback, delay) {
                let timer = setInterval(function () {
                    if (gameRunning && !gamePaused) callback();
                }, delay);
                gameTimers.add(timer);
                return timer;
            }

            function clearGameTimers() {
                gameTimers.forEach(function (timer) {
                    clearTimeout(timer);
                    clearInterval(timer);
                });
                gameTimers.clear();
            }

            function centerGameStage() {
                let scale = Math.min(
                    1,
                    window.innerWidth / GAME_WIDTH,
                    window.innerHeight / (GAME_HEIGHT + 2 * STATUS_HEIGHT)
                );
                $('.center-screen').css('--game-scale', scale);
            }

            function randomFallPosition(objectWidth, avoidPosition) {
                const min = FALLING_OBJECT_MARGIN;
                const max = GAME_WIDTH - objectWidth - FALLING_OBJECT_MARGIN;
                if (avoidPosition === null) {
                    return Math.floor(Math.random() * (max - min + 1)) + min;
                }

                for (let attempt = 0; attempt < 100; attempt++) {
                    const position = Math.floor(Math.random() * (max - min + 1)) + min;
                    if (Math.abs(position - avoidPosition) >= SAFE_FALL_DISTANCE) return position;
                }

                return Math.abs(min - avoidPosition) >= Math.abs(max - avoidPosition) ? min : max;
            }

            function elementsTouch(first, second) {
                const a = first.getBoundingClientRect();
                const b = second.getBoundingClientRect();
                return a.left <= b.right && a.right >= b.left
                    && a.top <= b.bottom && a.bottom >= b.top;
            }

            function glowDinosaurOnCatch() {
                const dinosaur = document.getElementById('dino');
                dinosaur.classList.remove('dino-caught');
                void dinosaur.offsetWidth;
                dinosaur.classList.add('dino-caught');
            }

            function endGame() {
                if (!gameRunning) return;
                gameRunning = false;
                clearGameTimers();
                $('#game-over').css('display', 'flex');
            }

            function clearEggSpawner() {
                if (eggProcess) {
                    clearInterval(eggProcess);
                    gameTimers.delete(eggProcess);
                    eggProcess = null;
                }
                if (eggSpawnTimer) {
                    clearTimeout(eggSpawnTimer);
                    gameTimers.delete(eggSpawnTimer);
                    eggSpawnTimer = null;
                }
                $('#canvas img[name="egg"]').remove();
                eggInFlight = false;
                eggSpawnScheduled = false;
                eggPositionX = null;
            }

            function startGame() {
                clearGameTimers();
                clearEggSpawner();
                gameRunning = true;
                speedEgg = 50;
                speedMeteorite = 20;
                meteoriteFallStep = DEFAULT_METEORITE_FALL_STEP;
                counterMeteorites = 0;
                counterEggs = 0;
                counterSavedEggs = 0;
                totalSavedEggs = 0;
                counterGoldenEggs = 0;
                maxMeteorites = 100;
                currentBiomeIndex = 0;
                maxEggs = BIOMES[0].eggsToUnlock;
                delayBetweenMeteorites = 500;
                delayBetweenEggs = 2000;
                meteoritePositionX = 0;
                meteoriteActive = false;
                eggPositionX = null;
                maxMeteorSpeed = BIOMES[0].maxMeteorSpeed;
                timeScale = 1;
                slowActive = false;
                gamePaused = true;
                eggInFlight = false;
                eggSpawnScheduled = false;
                stopSnow();
                applyBiomeVisuals();
                $('#canvas').empty().append('<img src="./dino1.png" style="left:950px; top:480px; position:absolute" id="dino" name="dino"/>');
                $('#game-over').hide();
                updateStatus();
                showBiomeBanner(getCurrentBiome());
                gameInterval(function () {
                    meteoriteFallStep = Math.min(maxMeteorSpeed, meteoriteFallStep + 2);
                    updateStatus();
                }, 5000);
                showCountdown().then(function () {
                    if (!gameRunning) return;
                    gamePaused = false;
                    meteoriteFall();
                    eggFall();
                });
            }

            function resetMeteoriteSpeed() {
                meteoriteFallStep = DEFAULT_METEORITE_FALL_STEP;
            }

            function getCurrentBiome() {
                return BIOMES[currentBiomeIndex];
            }

            function applyBiomeVisuals() {
                const biome = getCurrentBiome();
                $('#canvas').css('background-image', 'url("' + biome.background + '")');
                $('#canvas').css('background-repeat', 'no-repeat');
                $('#canvas').css('background-size', 'contain, cover');
                $('#canvas').toggleClass('ice-biome', Boolean(biome.iceEffects));
                $('#meteorit').attr('src', biome.meteoriteImage || './meteor-green.png');
                if (biome.snow) {
                    if (!snowInterval) startSnow();
                } else {
                    stopSnow();
                }
                if (biome.burningDust) {
                    if (!volcanoDustInterval) startVolcanoDust();
                } else {
                    stopVolcanoDust();
                }
            }

            function showBiomeBanner(biome) {
                if (!biome.name) return;
                $('#biome-banner').remove();
                const banner = $('<div>', {id: 'biome-banner'}).css({
                    position: 'absolute',
                    top: '50%',
                    left: '50%',
                    transform: 'translate(-50%, -50%)',
                    fontSize: '48px',
                    fontWeight: 'bold',
                    color: biome.bannerColor || '#fff',
                    textShadow: biome.bannerShadow || '0 0 20px rgba(255, 255, 255, 0.8)',
                    zIndex: 999,
                    pointerEvents: 'none',
                    textAlign: 'center'
                }).text(biome.name);
                if (biome.subtitle) {
                    banner.append('<br/>').append(
                        $('<span>').css('font-size', '24px').text(biome.subtitle)
                    );
                }
                $('#canvas').append(banner);
                sleep(3000).then(() => {
                    banner.fadeOut(600, function () { $(this).remove(); });
                });
            }

            function showCountdown() {
                gamePaused = true;
                return new Promise(function (resolve) {
                    let number = 3;
                    function showNextNumber() {
                        const countdown = $('<div>', {id: 'biome-countdown', class: 'biome-countdown'}).text(number);
                        $('#biome-countdown').remove();
                        $('#canvas').append(countdown);
                        sleep(1000).then(function () {
                            countdown.remove();
                            if (number === 1) {
                                gamePaused = false;
                                resolve();
                                return;
                            }
                            number--;
                            showNextNumber();
                        });
                    }
                    showNextNumber();
                });
            }

            function advanceToNextBiome() {
                if (currentBiomeIndex >= BIOMES.length - 1) return false;
                clearEggSpawner();
                meteoriteActive = Boolean($('#meteorit').length);
                currentBiomeIndex++;
                const biome = getCurrentBiome();
                counterMeteorites = 0;
                counterEggs = 0;
                counterSavedEggs = 0;
                counterGoldenEggs = 0;
                maxMeteorites = 100;
                maxEggs = biome.eggsToUnlock;
                maxMeteorSpeed = biome.maxMeteorSpeed;
                resetMeteoriteSpeed();
                applyBiomeVisuals();
                showBiomeBanner(biome);
                updateStatus();
                showCountdown().then(function () {
                    if (!gameRunning) return;
                    gamePaused = false;
                    eggFall();
                });
                return true;
            }

            function completeLevelWithCheat() {
                if (currentBiomeIndex >= BIOMES.length - 1) return;
                totalSavedEggs += Math.max(0, maxEggs - counterSavedEggs);
                counterSavedEggs = Math.max(counterSavedEggs, maxEggs);
                updateDatabase("dino_god67", {"eggsSaved": totalSavedEggs});
                advanceToNextBiome();
            }

            function scheduleEggFall(delay) {
                if (eggInFlight || eggSpawnScheduled) return;
                eggSpawnScheduled = true;
                eggSpawnTimer = setTimeout(function () {
                    gameTimers.delete(eggSpawnTimer);
                    eggSpawnTimer = null;
                    eggSpawnScheduled = false;
                    if (gameRunning && counterEggs < maxEggs) eggFall();
                }, delay);
                gameTimers.add(eggSpawnTimer);
            }

            let snowInterval = null;

            function initSnowGround() {
                if ($('#snow-ground').length) return;
                $('#canvas').append('<canvas id="snow-ground" style="position:absolute;bottom:0;left:0;z-index:997;pointer-events:none;"></canvas>');
                const c = document.getElementById('snow-ground');
                c.width = 1152;
                c.height = 80;
            }

            function addSnowToGround(x) {
                const c = document.getElementById('snow-ground');
                if (!c) return;
                const ctx = c.getContext('2d');
                // Each landed flake adds a soft white blob, slowly building up a pile
                const radius = Math.random() * 7 + 4;
                ctx.beginPath();
                ctx.ellipse(x, c.height, radius, radius * 0.55, 0, Math.PI, 0);
                ctx.fillStyle = 'rgba(255,255,255,0.75)';
                ctx.fill();
            }

            function clearSnowGround() {
                const c = document.getElementById('snow-ground');
                if (c) {
                    c.getContext('2d').clearRect(0, 0, c.width, c.height);
                    $(c).remove();
                }
            }

            function startSnow() {
                initSnowGround();
                snowInterval = gameInterval(function () {
                    let left = Math.random() * 1130;
                    let size = Math.floor(Math.random() * 16) + 8;
                    let duration = Math.random() * 4 + 3;
                    let drift = Math.floor(Math.random() * 41) - 20;
                    let id = 'sf' + Date.now() + Math.random().toString(36).slice(2);
                    $('#canvas').append(
                        '<span id="' + id + '" class="snowflake" style="left:' + left + 'px;width:' + size + 'px;height:' + size + 'px;--snow-drift:' + drift + 'px;animation-duration:' + duration + 's;"></span>'
                    );
                    let timer = setTimeout(function () {
                        gameTimers.delete(timer);
                        addSnowToGround(left + drift);
                        $('#' + id).remove();
                    }, duration * 1000);
                    gameTimers.add(timer);
                }, 150);
            }

            function stopSnow() {
                if (snowInterval) {
                    clearInterval(snowInterval);
                    gameTimers.delete(snowInterval);
                }
                snowInterval = null;
                $('.snowflake').remove();
                clearSnowGround();
            }

            let volcanoDustInterval = null;

            function startVolcanoDust() {
                volcanoDustInterval = gameInterval(function () {
                    const left = Math.random() * GAME_WIDTH;
                    const top = Math.random() * GAME_HEIGHT * 0.45;
                    const size = Math.random() * 5 + 3;
                    const duration = Math.random() * 4 + 3.5;
                    const middleDrift = Math.floor(Math.random() * 261) - 130;
                    const lateDrift = Math.floor(Math.random() * 261) - 130;
                    const endDrift = middleDrift + Math.floor(Math.random() * 161) - 80;
                    const id = 'vd' + Date.now() + Math.random().toString(36).slice(2);
                    $('#canvas').append(
                        '<span id="' + id + '" class="volcano-dust" style="left:' + left + 'px;top:' + top + 'px;width:' + size + 'px;height:' + size + 'px;--wind-mid:' + middleDrift + 'px;--wind-late:' + lateDrift + 'px;--wind-end:' + endDrift + 'px;animation-duration:' + duration + 's;"></span>'
                    );
                    const timer = setTimeout(function () {
                        gameTimers.delete(timer);
                        $('#' + id).remove();
                    }, duration * 1000);
                    gameTimers.add(timer);
                }, 140);
            }

            function stopVolcanoDust() {
                if (volcanoDustInterval) {
                    clearInterval(volcanoDustInterval);
                    gameTimers.delete(volcanoDustInterval);
                }
                volcanoDustInterval = null;
                $('.volcano-dust').remove();
            }

            // Secret cheat code listener
            let cheatBuffer = '';
            document.addEventListener('keypress', function (e) {
                cheatBuffer += e.key.toLowerCase();
                if (!gameRunning || gamePaused) return;
                if (cheatBuffer.length > 6) cheatBuffer = cheatBuffer.slice(-6);
                if (cheatBuffer.endsWith('iddqd')) {
                    cheatBuffer = '';
                    completeLevelWithCheat();
                } else if (cheatBuffer.endsWith('m8;8hi')) {
                    // Silent slowdown cheat
                    cheatBuffer = '';
                    timeScale = 50;
                    slowActive = true;
                } else if (cheatBuffer.endsWith('back')) {
                    cheatBuffer = '';
                    // Restore normal speed without changing the current biome.
                    timeScale = 1;
                    slowActive = false;
                    applyBiomeVisuals();
                } else if (cheatBuffer.endsWith('tundra')) {
                    cheatBuffer = '';
                    completeLevelWithCheat();
                }
            });

            function updateStatus() {
                $('#status-1').text("Eggs: " + counterEggs + "/" + maxEggs);
                $('#status-2').text("Eggs saved: " + counterSavedEggs);
                $('#status-4').text("Meteor speed: " + meteoriteFallStep);
                $('#status-3').text("Golden eggs: " + counterGoldenEggs);
            }

            function performMeteoriteFall(object, process) {
                if (!gameRunning || gamePaused) return;
                let top = $(object).css('top');
                let top1 = parseFloat(top.replace("px", ""));
                let newTop = top1 + (meteoriteFallStep / timeScale);
                $(object).css('top', newTop + "px");

                const meteorite = $(object)[0];
                const dinosaur = $('#dino')[0];
                if (meteorite && dinosaur && elementsTouch(meteorite, dinosaur)) {
                    $('#dino').css('filter', 'opacity(0.5) drop-shadow(0 0 0 red)');
                    endGame();
                    return;
                }
                if (top1 > 530) {
                    let impact = $(object).position().left - 25;
                    let uniqueTimestamp = Math.round(+new Date() / 1000).toString();
                    $("#canvas").append("<img src=\"./meteor-crater.png\" style=\"width:120px; left:" + impact + "px; top:580px; position: absolute\" id=\"crater" + uniqueTimestamp + "\" name=\"crater" + uniqueTimestamp + "\" />");

                    sleep(1500).then(() => {
                        $('#crater' + uniqueTimestamp).fadeOut(30);
                        $('#crater' + uniqueTimestamp).remove();
                    });

                    $(object).remove();
                    clearInterval(process);
                    gameTimers.delete(process);
                    meteoriteActive = false;

                    if (counterMeteorites < maxMeteorites) {
                        sleep(delayBetweenMeteorites).then(() => {
                            meteoriteFall();
                        });
                    }
                }
            }

            function performEggFall(object, process) {
                if (!gameRunning || gamePaused) return;
                let top = $(object).css('top');
                let top1 = parseFloat(top.replace("px", ""));
                let newTop = top1 + (6 / timeScale);
                $(object).css('top', newTop + "px");
                const eggElement = $(object)[0];
                const dinosaur = $('#dino')[0];
                const caught = eggElement && dinosaur && elementsTouch(eggElement, dinosaur);
                if (caught || newTop > 550) {
                    clearInterval(process);
                    gameTimers.delete(process);
                    if (eggProcess === process) eggProcess = null;
                    eggInFlight = false;
                    eggPositionX = null;

                    if (caught) {
                        // caught
                        $(object).remove();
                        glowDinosaurOnCatch();
                        counterSavedEggs++;
                        totalSavedEggs++;
                        updateDatabase("dino_god67", {"eggsSaved": totalSavedEggs});
                        updateStatus();
                        if (counterSavedEggs >= maxEggs) {
                            advanceToNextBiome();
                            return;
                        }
                    } else {

                        // break
                        const biome = getCurrentBiome();
                        const redTint = 'linear-gradient(rgba(255, 0, 0, 0.25), rgba(255, 0, 0, 0.25)), ';
                        $('#canvas').css('background-image', redTint + 'url("' + biome.background + '")');

                        $(object).attr('src', 'egg-white-2.png');
                        sleep(50).then(() => {
                            $(object).attr('src', 'egg-white-3.png');
                        });
                        sleep(50).then(() => applyBiomeVisuals());
                        sleep(1000).then(() => $(object).remove());
                    }
                    if (counterEggs < maxEggs) {
                        scheduleEggFall(delayBetweenEggs);
                    }
                }
            }


            function meteoriteFall() {
                if (!gameRunning || counterMeteorites >= maxMeteorites) return;
                counterMeteorites++;
                let pos = randomFallPosition(METEOR_WIDTH, eggInFlight ? eggPositionX : null);
                meteoritePositionX = pos
                meteoriteActive = true;
                let meteoriteImage = getCurrentBiome().meteoriteImage || './meteor-green.png';
                $("#canvas").append("<img src=\"" + meteoriteImage + "\" style=\"left:" + pos + "px; top:0px; width: 70px; position: absolute\" id=\"meteorit\" name=\"meteorit\" />");
                let meteoriteProcess = gameInterval(function () {
                    let d = performMeteoriteFall('#meteorit', meteoriteProcess);
                }, speedMeteorite);
            }

            function eggFall() {
                if (!gameRunning || eggInFlight || counterEggs >= maxEggs) return;
                eggInFlight = true;
                counterEggs++;
                let isGoldenEgg = (counterEggs % 5 === 0);
                if (isGoldenEgg) {
                    counterGoldenEggs++;
                }
                updateStatus();
                let pos = randomFallPosition(EGG_WIDTH, meteoriteActive ? meteoritePositionX : null);
                eggPositionX = pos;
                let goldenClass = isGoldenEgg ? " class='golden-egg'" : "";
                $("#canvas").append("<img src=\"./egg-white-1.png\" style=\"left:" + pos + "px; top:0px; width: 74px; position: absolute\" id=\"egg\" name=\"egg\"" + goldenClass + " />");
                eggProcess = gameInterval(function () {
                    d = performEggFall('#egg', eggProcess);
                }, speedEgg);
            }


            document.onkeydown = function (e) {
                if (!gameRunning || gamePaused) return;
                switch (e.keyCode) {
                    case 37:
                        let left = $('#dino').css('left');
                        let left1 = parseInt(left.replace("px", ""));
                        if (left1 <= 5) { break}
                        let nextLeft = left1 - 15;
                        $('#dino').css('left', nextLeft + "px");
                        $('#dino').css('transform', DINO_FACE_LEFT);
                        break;
                    case 39:
                        let right = $('#dino').css('left');
                        let right1 = parseInt(right.replace("px", ""));
                        if (right1 >= 950) { break}
                        let nextRight = right1 + 15;
                        $('#dino').css('left', nextRight + "px");
                        $('#dino').css('transform', DINO_FACE_RIGHT);
                        break;
                }
            };

            $('#respawn').on('click', startGame);
            window.addEventListener('resize', centerGameStage);
            centerGameStage();
            startGame();

        });

    </script>


</head>
<html>

<div class="center-screen">
    <div id="header">
        <h1><span style='color:#660033;'>D</span>
            <span style='color:#ff8a24;'>I</span>
            <span style='color:#d23852;'>N</span>
            <span style='color:#4033b2;'>O</span>
            <span style='color:#ff6699;'>M</span>
            <span style='color:#993300;'>I</span>
            <span style='color:#ccff33;'>X</span></h1>
        <div class="left">
            <div class="status-text" id="status-1">
                Eggs: ??/??
            </div>
            <div class="status-text" id="status-2">
                Eggs saved: 0
            </div>
            <div class="status-text" id="status-4">
                Meteor speed: 0
            </div>
            <div class="status-text" id="status-3">
                Golden eggs: 0
            </div>
        </div>
    </div>

    <div style="max-width:1152px; max-height:648px; position: absolute; background-image: url('./background.jpg'); background-repeat: no-repeat; background-size: contain, cover;   height: 648px; width: 1152px;"
         id="canvas" name="canvas">

        <img src="./dino1.png" style="left:950px; top:480px; position: absolute" id="dino" name="dino"/>
    </div>

</div>

<div id="game-over" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
    <div class="game-over-content">
        <h2 id="game-over-title">You have fallen</h2>
        <button id="respawn" type="button">Respawn</button>
    </div>
</div>

</html>
</div>
</html>
