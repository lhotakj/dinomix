<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <title>Title</title>
    <link href="style.css" rel="stylesheet" type="text/css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>

        function updateDatabase(userName, updateData) {
            $.ajax({
                url: 'https://9enfj7en82.execute-api.eu-central-1.amazonaws.com/dinomix/update', // Replace with your API Gateway endpoint
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    user_id: userName,
                    prop: updateData
                }),
                success: function(response) {
                    console.log('Lambda response:', response);
                },
                error: function(xhr, status, error) {
                    console.error('Lambda call failed:', error);
                }
            });
        }

        $(function () {

            let speedEgg = 50;
            let speedMeteorite = 20;
            let meteoriteFallStep = 5;
            let counterMeteorites = 0;
            let counterEggs = 0;
            let counterSavedEggs = 0;
            let counterGoldenEggs = 0;
            let maxMeteorites = 100;
            let maxEggs = 10;
            let delayBetweenMeteorites = 500;
            let delayBetweenEggs = 2000;
            let dinoPositionX = 0;
            let meteoritePositionX = 0;
            const DINO_FACE_LEFT = 'scaleX(1)';
            const DINO_FACE_RIGHT = 'scaleX(-1)';

            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            function updateStatus() {
                $('#status-1').text("Eggs: " + counterEggs + "/" + maxEggs);
                $('#status-2').text("Eggs saved: " + counterSavedEggs);
                $('#status-4').text("Meteor speed: " + meteoriteFallStep);
                $('#status-3').text("Golden eggs: " + counterGoldenEggs);
            }

            function performMeteoriteFall(object, process) {
                let top = $(object).css('top');
                let top1 = parseInt(top.replace("px", ""));
                $(object).css('top', top1 + meteoriteFallStep + "px");

                if (top1 > 500) {
                    if ((dinoPositionX >= (meteoritePositionX -10)) && (dinoPositionX <= (meteoritePositionX +10))) {
                        $('#dino').css('filter', 'opacity(0.5) drop-shadow(0 0 0 red)');
                        console.log('hit')
                    }
                }
                if (top1 > 530) {
                    let impact = $(object).position().left - 25;
                    let uniqueTimestamp = Math.round(+new Date() / 1000).toString();
                    $("#canvas").append("<img src=\"./meteor-crater.png\" style=\"width:120px; left:" + impact + "px; top:580px; position: absolute\" id=\"crater" + uniqueTimestamp + "\" name=\"crater" + uniqueTimestamp + "\" />");

                    sleep(1500).then(() => {
                        $('#crater' + uniqueTimestamp).fadeOut(30);
                        $('#crater' + uniqueTimestamp).remove();
                    });

                    $(object).remove();
                    clearInterval(process);

                    if (counterMeteorites < maxMeteorites) {
                        sleep(delayBetweenMeteorites).then(() => {
                            meteoriteFall();
                        });
                    }
                }
            }

            function performEggFall(object, process) {
                let top = $(object).css('top');
                let top1 = parseInt(top.replace("px", ""));
                $(object).css('top', top1 + 6 + "px");
                if (top1 > 550) {
                    clearInterval(process);

                    if (($(object).position().left > $('#dino').position().left) && ($(object).position().left + 20 < $('#dino').position().left + 120)) {
                        // caught
                        $(object).remove();
                        counterSavedEggs++;
                        updateDatabase("dino_god67", {"eggsSaved": counterSavedEggs})
                        updateStatus();
                    } else {

                        // break
                        $('#canvas').css('background', 'rgba(255, 0, 0, 0.25)').fadeIn(10);

                        $(object).attr('src', 'egg-white-2.png');
                        sleep(50).then(() => {
                            $(object).attr('src', 'egg-white-3.png');
                        });
                        sleep(50).then(() => {
                            $('#canvas').css('background', 'url("./background.jpg")');
                            $('#canvas').css('background-size', 'contain, cover');
                        });
                    }
                    if (counterEggs < maxEggs) {
                        sleep(delayBetweenEggs).then(() => {
                            $(object).remove();
                            eggFall();
                        });
                    }
                }
            }


            function meteoriteFall() {
                counterMeteorites++;
                let pos = Math.floor(Math.random() * 1060) + 20;
                meteoritePositionX = pos
                $("#canvas").append("<img src=\"./meteor-green.png\" style=\"left:" + pos + "px; top:0px; width: 70px; position: absolute\" id=\"meteorit\" name=\"meteorit\" />");
                let meteoriteProcess = setInterval(function () {
                    let d = performMeteoriteFall('#meteorit', meteoriteProcess);
                }, speedMeteorite);
            }

            function eggFall() {
                counterEggs++;
                let isGoldenEgg = (counterEggs % 5 === 0);
                if (isGoldenEgg) {
                    counterGoldenEggs++;
                }
                updateStatus();
                let pos = Math.floor(Math.random() * 1060) + 20;
                let goldenClass = isGoldenEgg ? " class='golden-egg'" : "";
                $("#canvas").append("<img src=\"./egg-white-1.png\" style=\"left:" + pos + "px; top:0px; width: 74px; position: absolute\" id=\"egg\" name=\"egg\"" + goldenClass + " />");
                let eggProcess = setInterval(function () {
                    d = performEggFall('#egg', eggProcess);
                }, speedEgg);
            }


            document.onkeydown = function (e) {
                switch (e.keyCode) {
                    case 37:
                        let left = $('#dino').css('left');
                        let left1 = parseInt(left.replace("px", ""));
                        if (left1 <= 5) { break}
                        let nextLeft = left1 - 15;
                        $('#dino').css('left', nextLeft + "px");
                        $('#dino').css('transform', DINO_FACE_LEFT);
                        dinoPositionX = nextLeft;
                        break;
                    case 39:
                        let right = $('#dino').css('left');
                        let right1 = parseInt(right.replace("px", ""));
                        if (right1 >= 950) { break}
                        let nextRight = right1 + 15;
                        $('#dino').css('left', nextRight + "px");
                        $('#dino').css('transform', DINO_FACE_RIGHT);
                        dinoPositionX = nextRight;
                        break;
                }
            };

            updateStatus();
            setInterval(function () {
                meteoriteFallStep = Math.min(30, meteoriteFallStep + 2);
                updateStatus();
            }, 5000);
            meteoriteFall();
            eggFall();

        });

    </script>


</head>
<html>

<div class="center-screen">
    <div id="header">
        <h1><span style='color:#660033;'>D</span>
            <span style='color:#ff8a24;'>I</span>
            <span style='color:#d23852;'>N</span>
            <span style='color:#4033b2;'>O</span>
            <span style='color:#ff6699;'>M</span>
            <span style='color:#993300;'>I</span>
            <span style='color:#ccff33;'>X</span></h1>
        <div class="left">
            <div class="status-text" id="status-1">
                Eggs: ??/??
            </div>
            <div class="status-text" id="status-2">
                Eggs saved: 0
            </div>
            <div class="status-text" id="status-4">
                Meteor speed: 0
            </div>
            <div class="status-text" id="status-3">
                Golden eggs: 0
            </div>
        </div>
    </div>

    <div style="max-width:1152px; max-height:648px; position: absolute; background-image: url('./background.jpg'); background-repeat: no-repeat; background-size: contain, cover;   height: 648px; width: 1152px;"
         id="canvas" name="canvas">

        <img src="./dino1.png" style="left:950px; top:480px; position: absolute" id="dino" name="dino"/>
    </div>

</div>

</html>
</div>
</html>
