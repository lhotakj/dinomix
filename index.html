<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <title>Title</title>
    <link href="style.css" rel="stylesheet" type="text/css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>

        function updateDatabase(userName, updateData) {
            $.ajax({
                url: 'https://9enfj7en82.execute-api.eu-central-1.amazonaws.com/dinomix/update', // Replace with your API Gateway endpoint
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    user_id: userName,
                    prop: updateData
                }),
                success: function(response) {
                    console.log('Lambda response:', response);
                },
                error: function(xhr, status, error) {
                    console.error('Lambda call failed:', error);
                }
            });
        }

        $(function () {

            const BIOMES = [
                {
                    id: 'plain',
                    name: 'Forest',
                    subtitle: 'A wild adventure awaits!',
                    background: './background.jpg',
                    maxMeteorSpeed: 20,
                    eggsToUnlock: 10,
                    meteoriteImage: './meteor-green.png',
                    bannerColor: '#eaffd7',
                    bannerShadow: '0 0 20px #62c82e, 0 0 40px #1d6b24'
                },
                {
                    id: 'tundra',
                    name: 'Frosty Tundra',
                    subtitle: 'More eggs incoming!',
                    background: './background-tundra.png',
                    maxMeteorSpeed: 25,
                    eggsToUnlock: 25,
                    meteoriteImage: './meteor-blue.png',
                    iceEffects: true,
                    snow: true,
                    iceEggs: true,
                    bannerColor: '#F0F8FF',
                    bannerShadow: '0 0 20px #00aaff, 0 0 40px #0055ff'
                },
                {
                    id: 'volcano',
                    name: 'Volcano',
                    subtitle: 'Hot and fiery!',
                    background: './background-volcano.png',
                    maxMeteorSpeed: 30,
                    eggsToUnlock: 20,
                    meteoriteImage: './meteor-red.png',
                    burningDust: true,
                    bannerColor: '#961A2F',
                    bannerShadow: '0 0 20px #FF6347, 0 0 40px #FF0000'
                }
            ];
            const DEFAULT_METEORITE_FALL_STEP = 5;
            const GAME_WIDTH = 1152;
            const GAME_HEIGHT = 648;
            const STATUS_HEIGHT = 72;
            const DINO_WIDTH = 200;
            const DINO_HEIGHT = 159;
            const EGG_WIDTH = 74;
            const METEOR_WIDTH = 70;
            const ICE_EGGS_TO_UNLOCK = 5;
            // These sheets have 470x456 cells; the clipped fifth column is intentionally excluded.
            const SPRITE_FRAME_WIDTH = 470;
            const SPRITE_FRAME_HEIGHT = 456;
            const SPRITE_FRAME_COLUMNS = 4;
            const SPRITE_FRAME_ROWS = 4;
            const SPRITE_FRAME_COUNT = SPRITE_FRAME_COLUMNS * SPRITE_FRAME_ROWS;
            // Match the static dinosaur's ground baseline while normalizing each pose.
            const DINO_GROUND_LINE = 149;
            const FROST_SAURUS_STORAGE_KEY = 'dinomix.frostSaurusUnlocked';
            const EQUIPPED_SKIN_STORAGE_KEY = 'dinomix.equippedSkin';
            const DINO_ANIMATIONS = {
                default: { src: './dinosaurs/sprites-default.png', frames: [] },
                frost: { src: './dinosaurs/sprites-ice.png', frames: [] },
                lava: { src: './dinosaurs/sprites-lava.png', frames: [] }
            };
            const DINO_SPRITE_SHEET_BOUNDS = {
                // Tuned to match the original static dino proportions inside 200x159.
                default: { x: 8, y: 100, width: 448, height: 306 },
                frost: { x: 10, y: 105, width: 450, height: 304 },
                lava: { x: 4, y: 102, width: 462, height: 304 }
            };
            const DINO_FALLBACK_IMAGES = {};
            const SKINS = [
                { id: 'default', name: 'Dino Original', image: './dino1.png' },
                { id: 'frost', name: 'Frostosaurus', image: './dino-frost.png', unlockRequired: true }
            ];
            const SAFE_FALL_DISTANCE = DINO_WIDTH + Math.max(EGG_WIDTH, METEOR_WIDTH) + 10;
            const FALLING_OBJECT_MARGIN = 20;

            let speedEgg = 50;
            let speedMeteorite = 20;
            let meteoriteFallStep = DEFAULT_METEORITE_FALL_STEP;
            let counterMeteorites = 0;
            let counterEggs = 0;
            let counterSavedEggs = 0;
            let totalSavedEggs = 0;
            let counterGoldenEggs = 0;
            let counterIceEggs = 0;
            let frostSaurusUnlocked = false;
            let equippedSkin = 'default';
            let frostUnlockMessagePromise = null;
            try {
                frostSaurusUnlocked = window.localStorage.getItem(FROST_SAURUS_STORAGE_KEY) === 'true';
                equippedSkin = window.localStorage.getItem(EQUIPPED_SKIN_STORAGE_KEY) || 'default';
            } catch (error) {
                console.error('Could not load saved skin state:', error);
            }
            if (equippedSkin === 'frost' && !frostSaurusUnlocked) equippedSkin = 'default';
            let skinMenuOpen = false;
            let maxMeteorites = 100;
            let currentBiomeIndex = 0;
            let maxEggs = BIOMES[0].eggsToUnlock;
            let eggProcess = null;
            let eggSpawnTimer = null;
            let delayBetweenMeteorites = 500;
            let delayBetweenEggs = 2000;
            let meteoritePositionX = 0;
            let meteoriteActive = false;
            let meteoriteProcess = null;
            let meteoriteSpawnTimer = null;
            let eggPositionX = null;
            let maxMeteorSpeed = BIOMES[0].maxMeteorSpeed;
            let gameRunning = true;
            let gamePaused = false;
            let gameTimers = new Set();
            let dinosaurImmune = false;
            let dinosaurImmunityTimer = null;
            let dinoAnimationTimer = null;
            let dinoFacing = 'right';
            let currentDinoFrame = 0;
            let pressedMovementKeys = new Set();
            let eggInFlight = false;
            let eggSpawnScheduled = false;

            let timeScale = 1; // 1 = normal speed; higher values slow the game (e.g., 50)
            let slowActive = false;

            function sleep(ms) {
                return new Promise(resolve => {
                    let timer = setTimeout(function () {
                        gameTimers.delete(timer);
                        resolve();
                    }, ms);
                    gameTimers.add(timer);
                });
            }

            function gameInterval(callback, delay) {
                let timer = setInterval(function () {
                    if (gameRunning && !gamePaused) callback();
                }, delay);
                gameTimers.add(timer);
                return timer;
            }

            function clearGameTimers() {
                gameTimers.forEach(function (timer) {
                    clearTimeout(timer);
                    clearInterval(timer);
                });
                gameTimers.clear();
                dinosaurImmunityTimer = null;
                dinosaurImmune = false;
                dinoAnimationTimer = null;
                pressedMovementKeys.clear();
                meteoriteProcess = null;
                meteoriteSpawnTimer = null;
            }

            function renderDinosaurFrame() {
                const canvas = document.getElementById('dino');
                if (!canvas) return;
                const context = canvas.getContext('2d');
                context.clearRect(0, 0, DINO_WIDTH, DINO_HEIGHT);

                const animationId = equippedSkin === 'frost' && frostSaurusUnlocked
                    ? 'frost' : 'default';
                const animation = DINO_ANIMATIONS[animationId];
                const frame = animation.frames.length
                    ? animation.frames[currentDinoFrame % animation.frames.length] : null;
                const fallback = DINO_FALLBACK_IMAGES[animationId];
                context.save();
                if (dinoFacing === 'left') {
                    context.translate(DINO_WIDTH, 0);
                    context.scale(-1, 1);
                }
                if (frame) {
                    context.drawImage(frame, 0, 0);
                } else if (fallback && fallback.complete && fallback.naturalWidth) {
                    context.drawImage(fallback, 0, 0, DINO_WIDTH, DINO_HEIGHT);
                }
                context.restore();
            }

            function cacheDinosaurFrames(image, animationId) {
                        const animation = DINO_ANIMATIONS[animationId];
                        const bounds = DINO_SPRITE_SHEET_BOUNDS[animationId];
                        if (!animation || !bounds) {
                            console.error('Missing dinosaur animation metadata for:', animationId);
                            return;
                        }

                        animation.frames = [];
                        const scale = Math.min(
                            (DINO_WIDTH - 4) / bounds.width,
                            (DINO_HEIGHT - 4) / bounds.height
                        );
                        const destWidth = bounds.width * scale;
                        const destHeight = bounds.height * scale;
                        const destX = (DINO_WIDTH - destWidth) / 2;
                        const destY = DINO_GROUND_LINE - destHeight;

                        for (let row = 0; row < SPRITE_FRAME_ROWS; row++) {
                            for (let column = 0; column < SPRITE_FRAME_COLUMNS; column++) {
                                const frame = document.createElement('canvas');
                                frame.width = DINO_WIDTH;
                                frame.height = DINO_HEIGHT;
                                const frameContext = frame.getContext('2d');
                                frameContext.drawImage(
                                    image,
                                    column * SPRITE_FRAME_WIDTH + bounds.x,
                                    row * SPRITE_FRAME_HEIGHT + bounds.y,
                                    bounds.width,
                                    bounds.height,
                                    destX,
                                    destY,
                                    destWidth,
                                    destHeight
                                );
                                animation.frames.push(frame);
                            }
                        }

                        if (animation.frames.length !== SPRITE_FRAME_COUNT) {
                            console.error('Unexpected dinosaur sprite frame count:', animationId, animation.frames.length);
                        }
                        renderDinosaurFrame();
            }

            function prepareDinosaurAnimations() {
                        Object.keys(DINO_ANIMATIONS).forEach(function (animationId) {
                            const animation = DINO_ANIMATIONS[animationId];
                            const image = new Image();
                            image.onload = function () {
                                cacheDinosaurFrames(image, animationId);
                            };
                            image.onerror = function () {
                                console.error('Could not load dinosaur sprite sheet:', animation.src);
                            };
                            image.src = animation.src;
                        });

                        [
                            { id: 'default', src: './dino1.png' },
                            { id: 'frost', src: './dino-frost.png' }
                        ].forEach(function (skin) {
                            const image = new Image();
                            image.onload = renderDinosaurFrame;
                            image.onerror = function () {
                                console.error('Could not load dinosaur fallback image:', skin.src);
                            };
                            image.src = skin.src;
                            DINO_FALLBACK_IMAGES[skin.id] = image;
                        });
            }

            function isCheatPrefixInProgress(nextChar) {
                        const cheat = 'gimmeskins';
                        const candidate = (cheatBuffer + nextChar.toLowerCase()).toLowerCase().slice(-cheat.length);
                        for (let index = 0; index < candidate.length; index++) {
                            if (cheat.startsWith(candidate.slice(index))) return true;
                        }
                        return false;
            }

            function beginDinosaurMovement(keyCode, direction, nextLeft) {
                        $('#dino').css('left', nextLeft + 'px');
                        pressedMovementKeys.add(keyCode);
                        dinoFacing = direction;
                        const animationId = equippedSkin === 'frost' && frostSaurusUnlocked
                            ? 'frost' : 'default';
                        const frameCount = DINO_ANIMATIONS[animationId].frames.length;
                        if (frameCount) {
                            currentDinoFrame = (currentDinoFrame + 1) % frameCount;
                        }
                        if (!dinoAnimationTimer) {
                            renderDinosaurFrame();
                            dinoAnimationTimer = gameInterval(function () {
                                const activeAnimationId = equippedSkin === 'frost' && frostSaurusUnlocked
                                    ? 'frost' : 'default';
                                const activeFrameCount = DINO_ANIMATIONS[activeAnimationId].frames.length;
                                if (activeFrameCount) {
                                    currentDinoFrame = (currentDinoFrame + 1) % activeFrameCount;
                                }
                                renderDinosaurFrame();
                            }, 100);
                        } else {
                            renderDinosaurFrame();
                        }
            }

            function releaseDinosaurMovement(event) {
                if (event.keyCode !== 37 && event.keyCode !== 39) return;
                pressedMovementKeys.delete(event.keyCode);
                if (!pressedMovementKeys.size) {
                    if (dinoAnimationTimer) {
                        clearInterval(dinoAnimationTimer);
                        gameTimers.delete(dinoAnimationTimer);
                        dinoAnimationTimer = null;
                    }
                    return;
                }
                dinoFacing = pressedMovementKeys.has(37) ? 'left' : 'right';
                renderDinosaurFrame();
            }

            function centerGameStage() {
                let scale = Math.min(
                    1,
                    window.innerWidth / GAME_WIDTH,
                    window.innerHeight / (GAME_HEIGHT + 2 * STATUS_HEIGHT)
                );
                $('.center-screen').css('--game-scale', scale);
            }

            function randomFallPosition(objectWidth, avoidPosition) {
                const min = FALLING_OBJECT_MARGIN;
                const max = GAME_WIDTH - objectWidth - FALLING_OBJECT_MARGIN;
                if (avoidPosition === null) {
                    return Math.floor(Math.random() * (max - min + 1)) + min;
                }

                for (let attempt = 0; attempt < 100; attempt++) {
                    const position = Math.floor(Math.random() * (max - min + 1)) + min;
                    if (Math.abs(position - avoidPosition) >= SAFE_FALL_DISTANCE) return position;
                }

                return Math.abs(min - avoidPosition) >= Math.abs(max - avoidPosition) ? min : max;
            }

            function elementsTouch(first, second) {
                const a = first.getBoundingClientRect();
                const b = second.getBoundingClientRect();
                return a.left <= b.right && a.right >= b.left
                    && a.top <= b.bottom && a.bottom >= b.top;
            }

            function glowDinosaurOnCatch() {
                const dinosaur = document.getElementById('dino');
                if (dinosaurImmunityTimer) {
                    clearTimeout(dinosaurImmunityTimer);
                    gameTimers.delete(dinosaurImmunityTimer);
                }
                dinosaurImmune = true;
                dinosaur.classList.remove('dino-caught');
                void dinosaur.offsetWidth;
                dinosaur.classList.add('dino-caught');
                dinosaurImmunityTimer = setTimeout(function () {
                    gameTimers.delete(dinosaurImmunityTimer);
                    dinosaurImmunityTimer = null;
                    dinosaurImmune = false;
                    dinosaur.classList.remove('dino-caught');
                }, 2000);
                gameTimers.add(dinosaurImmunityTimer);
            }

            function endGame() {
                if (!gameRunning) return;
                gameRunning = false;
                clearGameTimers();
                $('#game-over').css('display', 'flex');
            }

            function clearEggSpawner() {
                if (eggProcess) {
                    clearInterval(eggProcess);
                    gameTimers.delete(eggProcess);
                    eggProcess = null;
                }
                if (eggSpawnTimer) {
                    clearTimeout(eggSpawnTimer);
                    gameTimers.delete(eggSpawnTimer);
                    eggSpawnTimer = null;
                }
                $('#canvas img[name="egg"]').remove();
                eggInFlight = false;
                eggSpawnScheduled = false;
                eggPositionX = null;
            }

            function showFrostSaurusUnlockMessage() {
                $('#frost-saurus-unlock').remove();
                gamePaused = true;
                const message = $('<div>', {
                    id: 'frost-saurus-unlock',
                    class: 'frost-saurus-unlock'
                }).append(
                    $('<div>').text('Congratulation for getting the Frostosaurus skin'),
                    $('<img>', { src: './dino-frost.png', alt: 'Frostosaurus skin' })
                );
                $('#canvas').append(message);
                frostUnlockMessagePromise = new Promise(function (resolve) {
                    const timer = setTimeout(function () {
                        gameTimers.delete(timer);
                        message.fadeOut(300, function () {
                            $(this).remove();
                            if (gameRunning && !skinMenuOpen) gamePaused = false;
                            resolve();
                        });
                    }, 4700);
                    gameTimers.add(timer);
                }).then(function () {
                    frostUnlockMessagePromise = null;
                });
            }

            function unlockFrostSaurus() {
                if (frostSaurusUnlocked) return;
                frostSaurusUnlocked = true;
                try {
                    window.localStorage.setItem(FROST_SAURUS_STORAGE_KEY, 'true');
                } catch (error) {
                    console.error('Could not save Frost-saurus unlock state:', error);
                }
                showFrostSaurusUnlockMessage();
            }

            function getAvailableSkins() {
                return SKINS.filter(function (skin) {
                    return !skin.unlockRequired || frostSaurusUnlocked;
                });
            }

            function renderSkinMenu() {
                const menu = $('#skin-menu');
                const availableSkins = getAvailableSkins();
                menu.empty();
                menu.append($('<h2>').text('Choose your dinosaur'));
                const choices = $('<div>', { class: 'skin-choices' });
                availableSkins.forEach(function (skin, index) {
                    const card = $('<button>', {
                        type: 'button',
                        class: 'skin-card' + (skin.id === equippedSkin ? ' selected' : ''),
                        'data-skin-id': skin.id
                    }).append(
                        $('<img>', { src: skin.image, alt: skin.name }),
                        $('<span>').text(skin.name)
                    );
                    card.on('click', function () {
                        selectSkin(index);
                    });
                    choices.append(card);
                });
                menu.append(choices);
                menu.append($('<p>').text('← → to browse · Enter to equip · Esc to close'));
            }

            function selectSkin(index) {
                const availableSkins = getAvailableSkins();
                if (!availableSkins.length) return;
                selectedSkinIndex = (index + availableSkins.length) % availableSkins.length;
                $('#skin-menu .skin-card').removeClass('selected')
                    .eq(selectedSkinIndex).addClass('selected');
            }

            let selectedSkinIndex = 0;

            function openSkinMenu() {
                if (!gameRunning || skinMenuOpen || $('#frost-saurus-unlock').length) return;
                gamePaused = true;
                skinMenuOpen = true;
                $('#skin-menu').css({display: 'flex', opacity: 0});
                const availableSkins = getAvailableSkins();
                selectedSkinIndex = Math.max(0, availableSkins.findIndex(function (skin) {
                    return skin.id === equippedSkin;
                }));
                renderSkinMenu();
                $('#skin-menu').stop(true, true).animate({opacity: 1}, 220);
            }

            function closeSkinMenu(shouldEquip) {
                if (!skinMenuOpen) return;
                if (shouldEquip) {
                    const selectedSkin = getAvailableSkins()[selectedSkinIndex];
                    if (selectedSkin) {
                        equippedSkin = selectedSkin.id;
                        renderDinosaurFrame();
                        try {
                            window.localStorage.setItem(EQUIPPED_SKIN_STORAGE_KEY, equippedSkin);
                        } catch (error) {
                            console.error('Could not save equipped skin:', error);
                        }
                    }
                }
                skinMenuOpen = false;
                $('#skin-menu').stop(true, true).animate({opacity: 0}, 220, function () {
                    $(this).hide();
                    $(this).empty();
                    if (gameRunning) gamePaused = false;
                });
            }

            function startGame() {
                clearGameTimers();
                clearEggSpawner();
                gameRunning = true;
                frostUnlockMessagePromise = null;
                skinMenuOpen = false;
                $('#skin-menu').hide().empty();
                speedEgg = 50;
                speedMeteorite = 20;
                meteoriteFallStep = DEFAULT_METEORITE_FALL_STEP;
                counterMeteorites = 0;
                counterEggs = 0;
                counterSavedEggs = 0;
                totalSavedEggs = 0;
                counterGoldenEggs = 0;
                counterIceEggs = 0;
                maxMeteorites = 100;
                currentBiomeIndex = 0;
                maxEggs = BIOMES[0].eggsToUnlock;
                delayBetweenMeteorites = 500;
                delayBetweenEggs = 2000;
                meteoritePositionX = 0;
                meteoriteActive = false;
                eggPositionX = null;
                maxMeteorSpeed = BIOMES[0].maxMeteorSpeed;
                timeScale = 1;
                slowActive = false;
                gamePaused = true;
                eggInFlight = false;
                eggSpawnScheduled = false;
                stopSnow();
                applyBiomeVisuals();
                updateBiomeCounterVisibility();
                dinoFacing = 'right';
                currentDinoFrame = 0;
                $('#canvas').empty().append(
                    $('<canvas>', {
                        id: 'dino',
                        name: 'dino',
                        width: DINO_WIDTH,
                        height: DINO_HEIGHT
                    }).css({left: '950px', top: '480px', position: 'absolute'})
                );
                renderDinosaurFrame();
                $('#game-over').hide();
                updateStatus();
                showBiomeBanner(getCurrentBiome());
                gameInterval(function () {
                    meteoriteFallStep = Math.min(maxMeteorSpeed, meteoriteFallStep + 1);
                    updateStatus();
                }, 5000);
                Promise.resolve(frostUnlockMessagePromise).then(showCountdown).then(function () {
                    if (!gameRunning) return;
                    gamePaused = false;
                    meteoriteFall();
                    eggFall();
                });
            }

            function resetMeteoriteSpeed() {
                meteoriteFallStep = DEFAULT_METEORITE_FALL_STEP;
            }

            function getCurrentBiome() {
                return BIOMES[currentBiomeIndex];
            }

            function applyBiomeVisuals() {
                const biome = getCurrentBiome();
                $('#canvas').css('background-image', 'url("' + biome.background + '")');
                $('#canvas').css('background-repeat', 'no-repeat');
                $('#canvas').css('background-size', 'contain, cover');
                $('#canvas').toggleClass('ice-biome', Boolean(biome.iceEffects));
                $('#meteorit').attr('src', biome.meteoriteImage || './meteor-green.png');
                if (biome.snow) {
                    if (!snowInterval) startSnow();
                } else {
                    stopSnow();
                }
                if (biome.burningDust) {
                    if (!volcanoDustInterval) startVolcanoDust();
                } else {
                    stopVolcanoDust();
                }
            }

            function showBiomeBanner(biome) {
                if (!biome.name) return;
                $('#biome-banner').remove();
                const banner = $('<div>', {id: 'biome-banner'}).css({
                    position: 'absolute',
                    top: '50%',
                    left: '50%',
                    transform: 'translate(-50%, -50%)',
                    fontSize: '48px',
                    fontWeight: 'bold',
                    color: biome.bannerColor || '#fff',
                    textShadow: biome.bannerShadow || '0 0 20px rgba(255, 255, 255, 0.8)',
                    zIndex: 999,
                    pointerEvents: 'none',
                    textAlign: 'center'
                }).text(biome.name);
                if (biome.subtitle) {
                    banner.append('<br/>').append(
                        $('<span>').css('font-size', '24px').text(biome.subtitle)
                    );
                }
                $('#canvas').append(banner);
                sleep(3000).then(() => {
                    banner.fadeOut(600, function () { $(this).remove(); });
                });
            }

            function showCountdown() {
                gamePaused = true;
                return new Promise(function (resolve) {
                    let number = 3;
                    function showNextNumber() {
                        const countdown = $('<div>', {id: 'biome-countdown', class: 'biome-countdown'}).text(number);
                        $('#biome-countdown').remove();
                        $('#canvas').append(countdown);
                        sleep(1000).then(function () {
                            countdown.remove();
                            if (number === 1) {
                                gamePaused = false;
                                resolve();
                                return;
                            }
                            number--;
                            showNextNumber();
                        });
                    }
                    showNextNumber();
                });
            }

            function advanceToNextBiome() {
                if (currentBiomeIndex >= BIOMES.length - 1) return false;
                clearEggSpawner();
                if (meteoriteProcess) {
                    clearInterval(meteoriteProcess);
                    gameTimers.delete(meteoriteProcess);
                    meteoriteProcess = null;
                }
                if (meteoriteSpawnTimer) {
                    clearTimeout(meteoriteSpawnTimer);
                    gameTimers.delete(meteoriteSpawnTimer);
                    meteoriteSpawnTimer = null;
                }
                $('#meteorit').remove();
                meteoriteActive = false;
                currentBiomeIndex++;
                const biome = getCurrentBiome();
                counterMeteorites = 0;
                counterEggs = 0;
                counterSavedEggs = 0;
                counterGoldenEggs = 0;
                counterIceEggs = 0;
                maxMeteorites = 100;
                maxEggs = biome.eggsToUnlock;
                maxMeteorSpeed = biome.maxMeteorSpeed;
                resetMeteoriteSpeed();
                applyBiomeVisuals();
                showBiomeBanner(biome);
                updateStatus();
                updateBiomeCounterVisibility();
                highlightBiomeCounter();
                showCountdown().then(function () {
                    if (!gameRunning) return;
                    gamePaused = false;
                    meteoriteFall();
                    eggFall();
                });
                return true;
            }

            function scheduleMeteoriteFall(delay) {
                if (meteoriteSpawnTimer) {
                    clearTimeout(meteoriteSpawnTimer);
                    gameTimers.delete(meteoriteSpawnTimer);
                }
                meteoriteSpawnTimer = setTimeout(function () {
                    gameTimers.delete(meteoriteSpawnTimer);
                    meteoriteSpawnTimer = null;
                    if (gamePaused) {
                        scheduleMeteoriteFall(250);
                        return;
                    }
                    meteoriteFall();
                }, delay);
                gameTimers.add(meteoriteSpawnTimer);
            }

            function completeLevelWithCheat() {
                if (currentBiomeIndex >= BIOMES.length - 1) return;
                totalSavedEggs += Math.max(0, maxEggs - counterSavedEggs);
                counterSavedEggs = Math.max(counterSavedEggs, maxEggs);
                updateDatabase("dino_god67", {"eggsSaved": totalSavedEggs});
                advanceToNextBiome();
            }

            function scheduleEggFall(delay) {
                if (eggInFlight || eggSpawnScheduled) return;
                eggSpawnScheduled = true;
                eggSpawnTimer = setTimeout(function () {
                    gameTimers.delete(eggSpawnTimer);
                    eggSpawnTimer = null;
                    eggSpawnScheduled = false;
                    if (!gameRunning || counterEggs >= maxEggs) return;
                    if (gamePaused) {
                        scheduleEggFall(250);
                        return;
                    }
                    eggFall();
                }, delay);
                gameTimers.add(eggSpawnTimer);
            }

            let snowInterval = null;

            function initSnowGround() {
                if ($('#snow-ground').length) return;
                $('#canvas').append('<canvas id="snow-ground" style="position:absolute;bottom:0;left:0;z-index:997;pointer-events:none;"></canvas>');
                const c = document.getElementById('snow-ground');
                c.width = 1152;
                c.height = 80;
            }

            function addSnowToGround(x) {
                const c = document.getElementById('snow-ground');
                if (!c) return;
                const ctx = c.getContext('2d');
                // Each landed flake adds a soft white blob, slowly building up a pile
                const radius = Math.random() * 7 + 4;
                ctx.beginPath();
                ctx.ellipse(x, c.height, radius, radius * 0.55, 0, Math.PI, 0);
                ctx.fillStyle = 'rgba(255,255,255,0.75)';
                ctx.fill();
            }

            function clearSnowGround() {
                const c = document.getElementById('snow-ground');
                if (c) {
                    c.getContext('2d').clearRect(0, 0, c.width, c.height);
                    $(c).remove();
                }
            }

            function startSnow() {
                initSnowGround();
                snowInterval = gameInterval(function () {
                    let left = Math.random() * 1130;
                    let size = Math.floor(Math.random() * 16) + 8;
                    let duration = Math.random() * 4 + 3;
                    let drift = Math.floor(Math.random() * 41) - 20;
                    let id = 'sf' + Date.now() + Math.random().toString(36).slice(2);
                    $('#canvas').append(
                        '<span id="' + id + '" class="snowflake" style="left:' + left + 'px;width:' + size + 'px;height:' + size + 'px;--snow-drift:' + drift + 'px;animation-duration:' + duration + 's;"></span>'
                    );
                    let timer = setTimeout(function () {
                        gameTimers.delete(timer);
                        addSnowToGround(left + drift);
                        $('#' + id).remove();
                    }, duration * 1000);
                    gameTimers.add(timer);
                }, 150);
            }

            function stopSnow() {
                if (snowInterval) {
                    clearInterval(snowInterval);
                    gameTimers.delete(snowInterval);
                }
                snowInterval = null;
                $('.snowflake').remove();
                clearSnowGround();
            }

            let volcanoDustInterval = null;

            function startVolcanoDust() {
                volcanoDustInterval = gameInterval(function () {
                    const left = Math.random() * GAME_WIDTH;
                    const top = Math.random() * GAME_HEIGHT * 0.45;
                    const size = Math.random() * 5 + 3;
                    const duration = Math.random() * 4 + 3.5;
                    const middleDrift = Math.floor(Math.random() * 261) - 130;
                    const lateDrift = Math.floor(Math.random() * 261) - 130;
                    const endDrift = middleDrift + Math.floor(Math.random() * 161) - 80;
                    const id = 'vd' + Date.now() + Math.random().toString(36).slice(2);
                    $('#canvas').append(
                        '<span id="' + id + '" class="volcano-dust" style="left:' + left + 'px;top:' + top + 'px;width:' + size + 'px;height:' + size + 'px;--wind-mid:' + middleDrift + 'px;--wind-late:' + lateDrift + 'px;--wind-end:' + endDrift + 'px;animation-duration:' + duration + 's;"></span>'
                    );
                    const timer = setTimeout(function () {
                        gameTimers.delete(timer);
                        $('#' + id).remove();
                    }, duration * 1000);
                    gameTimers.add(timer);
                }, 140);
            }

            function stopVolcanoDust() {
                if (volcanoDustInterval) {
                    clearInterval(volcanoDustInterval);
                    gameTimers.delete(volcanoDustInterval);
                }
                volcanoDustInterval = null;
                $('.volcano-dust').remove();
            }

            // Secret cheat code listener
            let cheatBuffer = '';
            document.addEventListener('keypress', function (e) {
                cheatBuffer += e.key.toLowerCase();
                if (!gameRunning || gamePaused) return;
                if (cheatBuffer.length > 10) cheatBuffer = cheatBuffer.slice(-10);
                if (cheatBuffer.endsWith('iddqd')) {
                    cheatBuffer = '';
                    completeLevelWithCheat();
                } else if (cheatBuffer.endsWith('m8;8hi')) {
                    // Silent slowdown cheat
                    cheatBuffer = '';
                    timeScale = 50;
                    slowActive = true;
                } else if (cheatBuffer.endsWith('back')) {
                    cheatBuffer = '';
                    // Restore normal speed without changing the current biome.
                    timeScale = 1;
                    slowActive = false;
                    applyBiomeVisuals();
                } else if (cheatBuffer.endsWith('tundra')) {
                    cheatBuffer = '';
                    completeLevelWithCheat();
                } else if (cheatBuffer.endsWith('gimmeskins')) {
                    cheatBuffer = '';
                    if (frostSaurusUnlocked) {
                        showFrostSaurusUnlockMessage();
                    } else {
                        unlockFrostSaurus();
                    }
                }
            });

            function updateStatus() {
                $('#status-1').text("Eggs: " + counterEggs + "/" + maxEggs);
                $('#status-2').text("Eggs saved: " + counterSavedEggs);
                $('#status-3').text("Golden eggs: " + counterGoldenEggs);
                $('#status-4').text("Meteor speed: " + meteoriteFallStep);
                $('#status-5').text("Ice eggs: " + counterIceEggs + "/" + ICE_EGGS_TO_UNLOCK);
            }

            function updateBiomeCounterVisibility() {
                const biome = getCurrentBiome();
                $('#status-3').css('display', biome.id === 'plain' ? 'block' : 'none');
                $('#status-5').css('display', biome.iceEggs ? 'block' : 'none');
            }

            function highlightBiomeCounter() {
                const counter = getCurrentBiome().iceEggs ? $('#status-5')[0] : $('#status-3')[0];
                counter.classList.remove('status-highlight');
                void counter.offsetWidth;
                counter.classList.add('status-highlight');
            }

            function performMeteoriteFall(object, process) {
                if (!gameRunning || gamePaused) return;
                let top = $(object).css('top');
                let top1 = parseFloat(top.replace("px", ""));
                let newTop = top1 + (meteoriteFallStep / timeScale);
                $(object).css('top', newTop + "px");

                const meteorite = $(object)[0];
                const dinosaur = $('#dino')[0];
                if (meteorite && dinosaur && elementsTouch(meteorite, dinosaur)) {
                    if (dinosaurImmune) {
                        $(object).remove();
                        clearInterval(process);
                        gameTimers.delete(process);
                        if (meteoriteProcess === process) meteoriteProcess = null;
                        meteoriteActive = false;
                        if (counterMeteorites < maxMeteorites) {
                            scheduleMeteoriteFall(delayBetweenMeteorites);
                        }
                    } else {
                        $('#dino').css('filter', 'opacity(0.5) drop-shadow(0 0 0 red)');
                        endGame();
                    }
                    return;
                }
                if (top1 > 530) {
                    let impact = $(object).position().left - 25;
                    let uniqueTimestamp = Math.round(+new Date() / 1000).toString();
                    $("#canvas").append("<img src=\"./meteor-crater.png\" style=\"width:120px; left:" + impact + "px; top:580px; position: absolute\" id=\"crater" + uniqueTimestamp + "\" name=\"crater" + uniqueTimestamp + "\" />");

                    sleep(1500).then(() => {
                        $('#crater' + uniqueTimestamp).fadeOut(30);
                        $('#crater' + uniqueTimestamp).remove();
                    });

                    $(object).remove();
                    clearInterval(process);
                    gameTimers.delete(process);
                    if (meteoriteProcess === process) meteoriteProcess = null;
                    meteoriteActive = false;

                    if (counterMeteorites < maxMeteorites) {
                        scheduleMeteoriteFall(delayBetweenMeteorites);
                    }
                }
            }

            function performEggFall(object, process) {
                if (!gameRunning || gamePaused) return;
                let top = $(object).css('top');
                let top1 = parseFloat(top.replace("px", ""));
                let newTop = top1 + (6 / timeScale);
                $(object).css('top', newTop + "px");
                const eggElement = $(object)[0];
                const dinosaur = $('#dino')[0];
                const caught = eggElement && dinosaur && elementsTouch(eggElement, dinosaur);
                const caughtIceEgg = caught && eggElement.classList.contains('ice-egg');
                if (caught || newTop > 550) {
                    clearInterval(process);
                    gameTimers.delete(process);
                    if (eggProcess === process) eggProcess = null;
                    eggInFlight = false;
                    eggPositionX = null;

                    if (caught) {
                        // caught
                        $(object).remove();
                        glowDinosaurOnCatch();
                        counterSavedEggs++;
                        totalSavedEggs++;
                        if (caughtIceEgg) {
                            counterIceEggs++;
                            if (counterIceEggs >= ICE_EGGS_TO_UNLOCK) {
                                unlockFrostSaurus();
                            }
                        }
                        updateDatabase("dino_god67", {"eggsSaved": totalSavedEggs});
                        updateStatus();
                        if (counterSavedEggs >= maxEggs) {
                            advanceToNextBiome();
                            return;
                        }
                    } else {

                        // break
                        const biome = getCurrentBiome();
                        const redTint = 'linear-gradient(rgba(255, 0, 0, 0.25), rgba(255, 0, 0, 0.25)), ';
                        $('#canvas').css('background-image', redTint + 'url("' + biome.background + '")');

                        $(object).attr('src', 'egg-white-2.png');
                        sleep(50).then(() => {
                            $(object).attr('src', 'egg-white-3.png');
                        });
                        sleep(50).then(() => applyBiomeVisuals());
                        sleep(1000).then(() => $(object).remove());
                    }
                    if (counterEggs < maxEggs) {
                        scheduleEggFall(delayBetweenEggs);
                    }
                }
            }


            function meteoriteFall() {
                if (!gameRunning || counterMeteorites >= maxMeteorites) return;
                counterMeteorites++;
                let pos = randomFallPosition(METEOR_WIDTH, eggInFlight ? eggPositionX : null);
                meteoritePositionX = pos
                meteoriteActive = true;
                let meteoriteImage = getCurrentBiome().meteoriteImage || './meteor-green.png';
                $("#canvas").append("<img src=\"" + meteoriteImage + "\" style=\"left:" + pos + "px; top:0px; width: 70px; position: absolute\" id=\"meteorit\" name=\"meteorit\" />");
                meteoriteProcess = gameInterval(function () {
                    let d = performMeteoriteFall('#meteorit', meteoriteProcess);
                }, speedMeteorite);
            }

            function eggFall() {
                if (!gameRunning || eggInFlight || counterEggs >= maxEggs) return;
                eggInFlight = true;
                counterEggs++;
                const biome = getCurrentBiome();
                const isSpecialEgg = counterEggs % 5 === 0;
                const isIceEgg = isSpecialEgg && biome.iceEggs;
                const isGoldenEgg = isSpecialEgg && !biome.iceEggs;
                if (isGoldenEgg) {
                    counterGoldenEggs++;
                }
                updateStatus();
                let pos = randomFallPosition(EGG_WIDTH, meteoriteActive ? meteoritePositionX : null);
                eggPositionX = pos;
                const specialEggClass = isIceEgg ? "ice-egg" : (isGoldenEgg ? "golden-egg" : "");
                const eggClass = specialEggClass ? " class='" + specialEggClass + "'" : "";
                $("#canvas").append("<img src=\"./egg-white-1.png\" style=\"left:" + pos + "px; top:0px; width: 74px; position: absolute\" id=\"egg\" name=\"egg\"" + eggClass + " />");
                eggProcess = gameInterval(function () {
                    d = performEggFall('#egg', eggProcess);
                }, speedEgg);
            }


            document.onkeydown = function (e) {
                if (!gameRunning) return;
                if (skinMenuOpen) {
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        e.preventDefault();
                        selectSkin(selectedSkinIndex + (e.key === 'ArrowRight' ? 1 : -1));
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        closeSkinMenu(true);
                    } else if (e.key === 'Escape') {
                        closeSkinMenu(false);
                    }
                    return;
                }
                if ((e.key === 's' || e.key === 'S') && !gamePaused) {
                    const cheatInProgress = isCheatPrefixInProgress(e.key);
                    if (!cheatInProgress) {
                        openSkinMenu();
                        return;
                    }
                }
                if (gamePaused) return;
                switch (e.keyCode) {
                    case 37:
                        let left = $('#dino').css('left');
                        let left1 = parseInt(left.replace("px", ""));
                        if (left1 <= 5) { break}
                        beginDinosaurMovement(37, 'left', left1 - 15);
                        break;
                    case 39:
                        let right = $('#dino').css('left');
                        let right1 = parseInt(right.replace("px", ""));
                        if (right1 >= 950) { break}
                        beginDinosaurMovement(39, 'right', right1 + 15);
                        break;
                }
            };

            document.addEventListener('keyup', releaseDinosaurMovement);
            window.addEventListener('blur', function () {
                if (dinoAnimationTimer) {
                    clearInterval(dinoAnimationTimer);
                    gameTimers.delete(dinoAnimationTimer);
                    dinoAnimationTimer = null;
                }
                pressedMovementKeys.clear();
            });
            $('#respawn').on('click', startGame);
            window.addEventListener('resize', centerGameStage);
            centerGameStage();
            prepareDinosaurAnimations();
            startGame();

        });

    </script>


</head>

        <h1><span style='color:#660033;'>D</span>
            <span style='color:#ff8a24;'>I</span>
            <span style='color:#d23852;'>N</span>
            <span style='color:#4033b2;'>O</span>
            <span style='color:#ff6699;'>M</span>
            <span style='color:#993300;'>I</span>
            <span style='color:#ccff33;'>X</span></h1>
        <div class="left">
            <div class="status-text" id="status-1">
                Eggs: ??/??
            </div>
            <div class="status-text" id="status-2">
                Eggs saved: 0
            </div>
            <div class="status-text" id="status-4">
                Meteor speed: 0
            </div>
            <div class="status-text" id="status-3">
                Golden eggs: 0
            </div>
            <div class="status-text" id="status-5">
                Ice eggs: 0/5
            </div>

            </div>
        </div>

    <div style="max-width:1152px; max-height:648px; position: absolute; background-image: url('./background.jpg'); background-repeat: no-repeat; background-size: contain, cover;   height: 648px; width: 1152px;"
         id="canvas" name="canvas">

        <img src="./dino1.png" style="left:950px; top:480px; position: absolute" id="dino" name="dino"/>
    </div>

</div>
