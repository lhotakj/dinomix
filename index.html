<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <title>Title</title>
    <link href="style.css" rel="stylesheet" type="text/css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>

        function updateDatabase(userName, updateData) {
            $.ajax({
                url: 'https://9enfj7en82.execute-api.eu-central-1.amazonaws.com/dinomix/update', // Replace with your API Gateway endpoint
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    user_id: userName,
                    prop: updateData
                }),
                success: function(response) {
                    console.log('Lambda response:', response);
                },
                error: function(xhr, status, error) {
                    console.error('Lambda call failed:', error);
                }
            });
        }

        $(function () {

            let speedEgg = 50;
            let speedMeteorite = 20;
            let meteoriteFallStep = 5;
            let counterMeteorites = 0;
            let counterEggs = 0;
            let counterSavedEggs = 0;
            let counterGoldenEggs = 0;
            let maxMeteorites = 100;
            let maxEggs = 10;
            let delayBetweenMeteorites = 500;
            let delayBetweenEggs = 2000;
            let dinoPositionX = 0;
            let meteoritePositionX = 0;
            let maxMeteorSpeed = 30;
            let tundraActive = false;
            const DINO_FACE_LEFT = 'scaleX(1)';
            const DINO_FACE_RIGHT = 'scaleX(-1)';

            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            function activateTundra() {
                if (tundraActive) return;
                tundraActive = true;

                // Frosty tundra visuals
                $('#canvas').css('background-image', 'url("./background-tundra.png")');
                startSnow();
                $('#canvas').append('<div id="tundra-banner" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;color:#F0F8FF;text-shadow:0 0 20px #00aaff,0 0 40px #0055ff;z-index:999;pointer-events:none;text-align:center;">❄️ Frosty Tundra ❄️<br/><span style="font-size:24px;">More eggs incoming!</span></div>');
                sleep(3000).then(() => {
                    $('#tundra-banner').fadeOut(600, function () { $(this).remove(); });
                });

                // Raise limits
                maxMeteorSpeed = 45;
                maxEggs += 15;

                updateStatus();

                // Kick off the next wave of eggs
                sleep(delayBetweenEggs).then(() => eggFall());
            }

            let snowInterval = null;

            function initSnowGround() {
                if ($('#snow-ground').length) return;
                $('#canvas').append('<canvas id="snow-ground" style="position:absolute;bottom:0;left:0;z-index:997;pointer-events:none;"></canvas>');
                const c = document.getElementById('snow-ground');
                c.width = 1152;
                c.height = 80;
            }

            function addSnowToGround(x) {
                const c = document.getElementById('snow-ground');
                if (!c) return;
                const ctx = c.getContext('2d');
                // Each landed flake adds a soft white blob, slowly building up a pile
                const radius = Math.random() * 7 + 4;
                ctx.beginPath();
                ctx.ellipse(x, c.height, radius, radius * 0.55, 0, Math.PI, 0);
                ctx.fillStyle = 'rgba(255,255,255,0.75)';
                ctx.fill();
            }

            function clearSnowGround() {
                const c = document.getElementById('snow-ground');
                if (c) {
                    c.getContext('2d').clearRect(0, 0, c.width, c.height);
                    $(c).remove();
                }
            }

            function startSnow() {
                initSnowGround();
                const flakes = ['❄', '❅', '❆', '·', '•'];
                snowInterval = setInterval(function () {
                    let left = Math.random() * 1130;
                    let size = Math.floor(Math.random() * 16) + 8;
                    let duration = Math.random() * 4 + 3;
                    let flake = flakes[Math.floor(Math.random() * flakes.length)];
                    let id = 'sf' + Date.now() + Math.random().toString(36).slice(2);
                    $('#canvas').append(
                        '<span id="' + id + '" class="snowflake" style="left:' + left + 'px;font-size:' + size + 'px;animation-duration:' + duration + 's;">' + flake + '</span>'
                    );
                    // Final x drifts by -10px per the CSS animation end keyframe
                    setTimeout(function () {
                        addSnowToGround(left - 10);
                        $('#' + id).remove();
                    }, duration * 1000);
                }, 150);
            }

            function stopSnow() {
                clearInterval(snowInterval);
                snowInterval = null;
                $('.snowflake').remove();
                clearSnowGround();
            }

            function applyTundraVisuals() {
                tundraActive = true;
                $('#canvas').css('background-image', 'url("./background-tundra.png")');
                startSnow();
            }

            function removeTundraVisuals() {
                tundraActive = false;
                $('#canvas').css('background-image', 'url("./background.jpg")');
                stopSnow();
            }

            // Secret cheat code listener
            let cheatBuffer = '';
            document.addEventListener('keypress', function (e) {
                cheatBuffer += e.key;
                if (cheatBuffer.length > 6) cheatBuffer = cheatBuffer.slice(-6);
                if (cheatBuffer.endsWith('tundra')) {
                    cheatBuffer = '';
                    applyTundraVisuals();
                } else if (cheatBuffer.endsWith('back')) {
                    cheatBuffer = '';
                    removeTundraVisuals();
                }
            });

            function updateStatus() {
                $('#status-1').text("Eggs: " + counterEggs + "/" + maxEggs);
                $('#status-2').text("Eggs saved: " + counterSavedEggs);
                $('#status-4').text("Meteor speed: " + meteoriteFallStep);
                $('#status-3').text("Golden eggs: " + counterGoldenEggs);
            }

            function performMeteoriteFall(object, process) {
                let top = $(object).css('top');
                let top1 = parseInt(top.replace("px", ""));
                $(object).css('top', top1 + meteoriteFallStep + "px");

                if (top1 > 500) {
                    let meteorLeft = meteoritePositionX + 8;
                    let meteorRight = meteoritePositionX + 70 - 8;
                    if ((meteorLeft < dinoPositionX + 120) && (meteorRight > dinoPositionX)) {
                        $('#dino').css('filter', 'opacity(0.5) drop-shadow(0 0 0 red)');
                        console.log('hit')
                    }
                }
                if (top1 > 530) {
                    let impact = $(object).position().left - 25;
                    let uniqueTimestamp = Math.round(+new Date() / 1000).toString();
                    $("#canvas").append("<img src=\"./meteor-crater.png\" style=\"width:120px; left:" + impact + "px; top:580px; position: absolute\" id=\"crater" + uniqueTimestamp + "\" name=\"crater" + uniqueTimestamp + "\" />");

                    sleep(1500).then(() => {
                        $('#crater' + uniqueTimestamp).fadeOut(30);
                        $('#crater' + uniqueTimestamp).remove();
                    });

                    $(object).remove();
                    clearInterval(process);

                    if (counterMeteorites < maxMeteorites) {
                        sleep(delayBetweenMeteorites).then(() => {
                            meteoriteFall();
                        });
                    }
                }
            }

            function performEggFall(object, process) {
                let top = $(object).css('top');
                let top1 = parseInt(top.replace("px", ""));
                $(object).css('top', top1 + 6 + "px");
                if (top1 > 550) {
                    clearInterval(process);

                    let eggX = $(object).position().left;
                    let dinoX = $('#dino').position().left;
                    // overlap collision (same logic as meteorite): egg width is 74px, dino width is 120px
                    if ((eggX < dinoX + 120) && (eggX + 74 > dinoX)) {
                        // caught
                        $(object).remove();
                        counterSavedEggs++;
                        updateDatabase("dino_god67", {"eggsSaved": counterSavedEggs});
                        updateStatus();
                        if (counterSavedEggs >= maxEggs && !tundraActive) {
                            activateTundra();
                            return;
                        }
                    } else {

                        // break
                        $('#canvas').css('background', 'rgba(255, 0, 0, 0.25)').fadeIn(10);

                        $(object).attr('src', 'egg-white-2.png');
                        sleep(50).then(() => {
                            $(object).attr('src', 'egg-white-3.png');
                        });
                        sleep(50).then(() => {
                            $('#canvas').css('background', 'url("./background.jpg")');
                            $('#canvas').css('background-size', 'contain, cover');
                        });
                    }
                    if (counterEggs < maxEggs) {
                        sleep(delayBetweenEggs).then(() => {
                            $(object).remove();
                            eggFall();
                        });
                    }
                }
            }


            function meteoriteFall() {
                counterMeteorites++;
                let pos = Math.floor(Math.random() * 1060) + 20;
                meteoritePositionX = pos
                $("#canvas").append("<img src=\"./meteor-green.png\" style=\"left:" + pos + "px; top:0px; width: 70px; position: absolute\" id=\"meteorit\" name=\"meteorit\" />");
                let meteoriteProcess = setInterval(function () {
                    let d = performMeteoriteFall('#meteorit', meteoriteProcess);
                }, speedMeteorite);
            }

            function eggFall() {
                counterEggs++;
                let isGoldenEgg = (counterEggs % 5 === 0);
                if (isGoldenEgg) {
                    counterGoldenEggs++;
                }
                updateStatus();
                let pos = Math.floor(Math.random() * 1060) + 20;
                let goldenClass = isGoldenEgg ? " class='golden-egg'" : "";
                $("#canvas").append("<img src=\"./egg-white-1.png\" style=\"left:" + pos + "px; top:0px; width: 74px; position: absolute\" id=\"egg\" name=\"egg\"" + goldenClass + " />");
                let eggProcess = setInterval(function () {
                    d = performEggFall('#egg', eggProcess);
                }, speedEgg);
            }


            document.onkeydown = function (e) {
                switch (e.keyCode) {
                    case 37:
                        let left = $('#dino').css('left');
                        let left1 = parseInt(left.replace("px", ""));
                        if (left1 <= 5) { break}
                        let nextLeft = left1 - 15;
                        $('#dino').css('left', nextLeft + "px");
                        $('#dino').css('transform', DINO_FACE_LEFT);
                        dinoPositionX = nextLeft;
                        break;
                    case 39:
                        let right = $('#dino').css('left');
                        let right1 = parseInt(right.replace("px", ""));
                        if (right1 >= 950) { break}
                        let nextRight = right1 + 15;
                        $('#dino').css('left', nextRight + "px");
                        $('#dino').css('transform', DINO_FACE_RIGHT);
                        dinoPositionX = nextRight;
                        break;
                }
            };

            updateStatus();
            setInterval(function () {
                meteoriteFallStep = Math.min(maxMeteorSpeed, meteoriteFallStep + 2);
                updateStatus();
            }, 5000);
            meteoriteFall();
            eggFall();

        });

    </script>


</head>
<html>

<div class="center-screen">
    <div id="header">
        <h1><span style='color:#660033;'>D</span>
            <span style='color:#ff8a24;'>I</span>
            <span style='color:#d23852;'>N</span>
            <span style='color:#4033b2;'>O</span>
            <span style='color:#ff6699;'>M</span>
            <span style='color:#993300;'>I</span>
            <span style='color:#ccff33;'>X</span></h1>
        <div class="left">
            <div class="status-text" id="status-1">
                Eggs: ??/??
            </div>
            <div class="status-text" id="status-2">
                Eggs saved: 0
            </div>
            <div class="status-text" id="status-4">
                Meteor speed: 0
            </div>
            <div class="status-text" id="status-3">
                Golden eggs: 0
            </div>
        </div>
    </div>

    <div style="max-width:1152px; max-height:648px; position: absolute; background-image: url('./background.jpg'); background-repeat: no-repeat; background-size: contain, cover;   height: 648px; width: 1152px;"
         id="canvas" name="canvas">

        <img src="./dino1.png" style="left:950px; top:480px; position: absolute" id="dino" name="dino"/>
    </div>

</div>

</html>
</div>
</html>
